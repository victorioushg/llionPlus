<div class="wrapper">
  <div id="organization-exchanges-grid">
    <h6 class="detail-section-title">Monedas y cambios</h6>
    <ejs-grid
      #exchangesgrid
      [dataSource]="(exchangeRates$ | async) || []"
      [toolbar]="exchangesToolbar"
      [editSettings]="exchangesEditSettings"
      [cssClass]="exchangesGridEnabled ? '' : 'disablegrid'"
      [height]="exchangesGridHeight"
      [rowHeight]="exchangesGridRowHeight"
      [headerHeight]="exchangesGridHeaderHeight"
      [width]="'100%'"
      clipMode="EllipsisWithTooltip"
      (actionBegin)="actionBegin($event)"
      (actionComplete)="actionComplete($event)"
    >
      <e-columns>
        <e-column
          field="currency"
          headerText="Moneda"
          width="25%"
        ></e-column>
        <e-column
          field="amount"
          headerText="Tipo de cambio"
          format="N4"
          textAlign="Right"
          width="35%"
        ></e-column>
        <e-column
          field="interchangeDate"
          headerText="Vigencia"
          type="date"
          format="dd/MM/yyyy"
          textAlign="Center"
          width="40%"
        ></e-column>
        <e-column
          field="rowKey"
          [isPrimaryKey]="true"
          [visible]="false"
        ></e-column>
        <e-column field="organizationId" [visible]="false"></e-column>
      </e-columns>

      <ng-template #editSettingsTemplate let-data>
        <div ngForm #exchangeForm="ngForm" class="exchange-edit-dialog">
          <input
            type="hidden"
            name="organizationId"
            [(ngModel)]="exchangeData.organizationId"
          />
          <input
            type="hidden"
            name="rowKey"
            [(ngModel)]="exchangeData.rowKey"
          />

          <div class="row">
            <div class="col-md-6">
              <ejs-dropdownlist
                id="currency"
                name="currency"
                [(ngModel)]="exchangeData.currency"
                [dataSource]="(currencies$ | async) || []"
                [fields]="currencyFields"
                placeholder="Moneda"
                floatLabelType="Always"
                [required]="true"
              ></ejs-dropdownlist>
            </div>
            <div class="col-md-6">
              <ejs-numerictextbox
                id="amount"
                name="amount"
                [(ngModel)]="exchangeData.amount"
                placeholder="Tipo de cambio"
                floatLabelType="Always"
                format="n4"
                [decimals]="4"
                [validateDecimalOnType]="true"
                [min]="0"
                [required]="true"
              ></ejs-numerictextbox>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <ejs-datepicker
                id="interchangeDate"
                name="interchangeDate"
                [(ngModel)]="exchangeData.interchangeDate"
                placeholder="Vigencia"
                floatLabelType="Always"
                format="dd/MM/yyyy"
                [required]="true"
              ></ejs-datepicker>
            </div>
          </div>
        </div>
      </ng-template>
    </ejs-grid>
  </div>
</div>

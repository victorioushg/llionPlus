<div class="wrapper" [class.retentions-grid-disabled]="!retentionsGridEnabled">
  <div id="organization-retentions-grid">
    <ejs-grid
      #retentionsgrid
      [dataSource]="(retentions$ | async) || []"
      [toolbar]="retentionsToolbar"
      [editSettings]="retentionsEditSettings"
      [cssClass]="retentionsGridEnabled ? '' : 'disablegrid'"
      [height]="retentionsGridHeight"
      [rowHeight]="retentionsGridRowHeight"
      [headerHeight]="retentionsGridHeaderHeight"
      [width]="'100%'"
      clipMode="EllipsisWithTooltip"
      (actionBegin)="actionBegin($event)"
      (actionComplete)="actionComplete($event)"
    >
      <e-columns>
        <e-column
          field="retentionCode"
          headerText="Código"
          width="12%"
        ></e-column>
        <e-column
          field="description"
          headerText="Descripción"
          width="28%"
        ></e-column>
        <e-column
          field="taxBaseRate"
          headerText="% Base"
          format="P2"
          textAlign="Right"
          width="12%"
        ></e-column>
        <e-column
          field="taxRate"
          headerText="% Retención"
          format="P2"
          textAlign="Right"
          width="12%"
        ></e-column>
        <e-column
          field="retentionType"
          headerText="Tipo"
          width="14%"
        ></e-column>
        <e-column
          field="taxerType"
          headerText="Contribuyente"
          width="14%"
        ></e-column>
        <e-column
          field="accumulated"
          headerText="Acum."
          width="8%"
          displayAsCheckBox="true"
          textAlign="Center"
          type="boolean"
        ></e-column>
        <e-column
          field="minPaymentAmount"
          headerText="Pago mínimo"
          format="N2"
          textAlign="Right"
          [visible]="false"
        ></e-column>
        <e-column
          field="substratedAmount"
          headerText="Sustraendo"
          format="N2"
          textAlign="Right"
          [visible]="false"
        ></e-column>
        <e-column field="comment" headerText="Comentario" [visible]="false"></e-column>
        <e-column field="accountId" headerText="Cuenta" [visible]="false"></e-column>
        <e-column field="classId" headerText="Clase" [visible]="false"></e-column>
        <e-column
          field="taxRetentionId"
          [isPrimaryKey]="true"
          [visible]="false"
        ></e-column>
        <e-column field="organizationId" [visible]="false"></e-column>
      </e-columns>

      <ng-template #editSettingsTemplate let-data>
        <div ngForm #retentionForm="ngForm" class="retention-edit-dialog">
          <input
            type="hidden"
            name="taxRetentionId"
            [(ngModel)]="retentionData.taxRetentionId"
          />
          <input
            type="hidden"
            name="organizationId"
            [(ngModel)]="retentionData.organizationId"
          />

          <div class="row">
            <div class="col-md-4">
              <ejs-textbox
                id="retentionCode"
                name="retentionCode"
                [(ngModel)]="retentionData.retentionCode"
                placeholder="Código"
                floatLabelType="Always"
                [required]="true"
              ></ejs-textbox>
            </div>
            <div class="col-md-4">
              <ejs-textbox
                id="retentionType"
                name="retentionType"
                [(ngModel)]="retentionData.retentionType"
                placeholder="Tipo de retención"
                floatLabelType="Always"
              ></ejs-textbox>
            </div>
            <div class="col-md-4">
              <ejs-textbox
                id="taxerType"
                name="taxerType"
                [(ngModel)]="retentionData.taxerType"
                placeholder="Tipo de contribuyente"
                floatLabelType="Always"
              ></ejs-textbox>
            </div>
          </div>

          <div class="row">
            <div class="col-md-12">
              <ejs-textbox
                id="description"
                name="description"
                [(ngModel)]="retentionData.description"
                placeholder="Descripción"
                floatLabelType="Always"
                [required]="true"
              ></ejs-textbox>
            </div>
          </div>

          <div class="row">
            <div class="col-md-3">
              <ejs-numerictextbox
                id="taxBaseRate"
                name="taxBaseRate"
                [(ngModel)]="retentionData.taxBaseRate"
                placeholder="% Base imponible"
                floatLabelType="Always"
                format="p2"
                [decimals]="4"
                [validateDecimalOnType]="true"
                [showSpinButton]="false"
              ></ejs-numerictextbox>
            </div>
            <div class="col-md-3">
              <ejs-numerictextbox
                id="taxRate"
                name="taxRate"
                [(ngModel)]="retentionData.taxRate"
                placeholder="% Retención"
                floatLabelType="Always"
                format="p2"
                [decimals]="4"
                [validateDecimalOnType]="true"
                [showSpinButton]="false"
              ></ejs-numerictextbox>
            </div>
            <div class="col-md-3">
              <ejs-numerictextbox
                id="minPaymentAmount"
                name="minPaymentAmount"
                [(ngModel)]="retentionData.minPaymentAmount"
                placeholder="Pago mínimo"
                floatLabelType="Always"
                format="n2"
                [decimals]="2"
                [validateDecimalOnType]="true"
                [showSpinButton]="false"
              ></ejs-numerictextbox>
            </div>
            <div class="col-md-3">
              <ejs-numerictextbox
                id="substratedAmount"
                name="substratedAmount"
                [(ngModel)]="retentionData.substratedAmount"
                placeholder="Sustraendo"
                floatLabelType="Always"
                format="n2"
                [decimals]="2"
                [validateDecimalOnType]="true"
                [showSpinButton]="false"
              ></ejs-numerictextbox>
            </div>
          </div>

          <div class="row">
            <div class="col-md-4">
              <ejs-numerictextbox
                id="accountId"
                name="accountId"
                [(ngModel)]="retentionData.accountId"
                placeholder="Cuenta (AccountId)"
                floatLabelType="Always"
                format="n0"
                [decimals]="0"
                [validateDecimalOnType]="true"
                [showSpinButton]="false"
              ></ejs-numerictextbox>
            </div>
            <div class="col-md-4">
              <ejs-numerictextbox
                id="classId"
                name="classId"
                [(ngModel)]="retentionData.classId"
                placeholder="Clase (ClassId)"
                floatLabelType="Always"
                format="n0"
                [decimals]="0"
                [validateDecimalOnType]="true"
                [showSpinButton]="false"
              ></ejs-numerictextbox>
            </div>
            <div class="col-md-4 switches-col">
              <label class="switch-label">
                <ejs-switch
                  [(ngModel)]="retentionData.accumulated"
                  name="accumulated"
                ></ejs-switch>
                Acumulada
              </label>
            </div>
          </div>

          <div class="row">
            <div class="col-md-12">
              <ejs-textbox
                id="comment"
                name="comment"
                [(ngModel)]="retentionData.comment"
                placeholder="Comentario"
                floatLabelType="Always"
              ></ejs-textbox>
            </div>
          </div>
        </div>
      </ng-template>
    </ejs-grid>
  </div>
</div>

<div id="container" class="container">
  <div class="row">
    <div class="col-lg-4">
      <div id="organization-grid" [class.wrapper]="disabledGrid$ | async">
        <ejs-grid
          #grid
          [dataSource]="organizations$ | async"
          [allowFiltering]="enabled$ | async"
          [cssClass]="(disabledGrid$ | async) ? 'disablegrid' : ''"
          [toolbar]="toolbar"
          [height]="screenHeight"
          [searchSettings]="searchSettings"
          (actionBegin)="actionBegin($event)"
          (toolbarClick)="onToolbarClick($event)"
          (rowSelected)="onRowSelected($event)"
          (rowDeselected)="onRowDeselected($event)"
          (recordDoubleClick)="onRecordDoubleClick($event)"
          (commandClick)="commandClick($event)"
        >
          <e-columns>
            <e-column width="50" [commands]="commands"></e-column>
            <e-column
              field="name"
              headerText="organización"
              width="230"
            ></e-column>
            <e-column
              field="taxRegistrationID"
              headerText=""
              width="100"
            ></e-column>
            <e-column
              field="organizationId"
              [isPrimaryKey]="true"
              [visible]="false"
            ></e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
    <div class="col-lg-8">
      <ejs-tab id="tabs" #tabs>
        <e-tabitems>
          <e-tabitem [header]="headerText[0]">
            <div class="row">
              <div class="col-lg-12">
                <ng-template #content>
                  <llion-organization-detail></llion-organization-detail>
                </ng-template>
              </div>
            </div>
          </e-tabitem>
          <e-tabitem [header]="headerText[1]">
            <ng-template #content>
              <div class="row">
                <div class="col-lg-6">
                  <llion-organization-parameters></llion-organization-parameters>
                </div>
              </div>
            </ng-template>
          </e-tabitem>
          <e-tabitem [header]="headerText[2]">
            <ng-template #content>
              <div class="row">
                <div class="col-lg-6">
                  <llion-organization-taxes></llion-organization-taxes>
                </div>
                <div class="col-lg-6">
                  <llion-organization-retentions></llion-organization-retentions>
                </div>
              </div>
            </ng-template>
          </e-tabitem>
          <e-tabitem [header]="headerText[3]">
            <ng-template #content>
              <div class="row">
                <div class="col-lg-6">
                  <llion-organization-credits></llion-organization-credits>
                </div>
              </div>
            </ng-template>
          </e-tabitem>
          <e-tabitem [header]="headerText[4]">
            <ng-template #content>
              <div class="row">
                <div class="col-lg-6">
                  <llion-organization-exchanges></llion-organization-exchanges>
                </div>
              </div>
            </ng-template>
          </e-tabitem>
        </e-tabitems>
      </ejs-tab>
    </div>
  </div>
  <div id="ej2Toast" #toast></div>
</div>

<div
  id="movement-container"
  class="container"
  [class.is-disabled]="!gridEnabled"
>
  <div class="row">
    <div class="col-lg-12">
      <div id="merchandise-movement-grid">
        <ejs-grid
          id="movement-grid"
          #grid
          [dataSource]="(movements$ | async) || []"
          [height]="screenMovementsHeight"
          [rowHeight]="rowHeight"
          [headerHeight]="headerHeight"
          [toolbar]="toolbar"
          [editSettings]="editSettings"
          [allowTextWrap]="false"
          clipMode="EllipsisWithTooltip"
          (actionBegin)="actionBegin($event)"
          (actionComplete)="actionComplete($event)"
        >
          <e-columns>
            <e-column
              field="movementId"
              [isPrimaryKey]="true"
              [visible]="false"
            ></e-column>
            <e-column field="merchandiseId" [visible]="false"></e-column>
            <e-column field="organizationId" [visible]="false"></e-column>
            <e-column
              field="movementDate"
              headerText="Fecha"
              type="dateTime"
              format="dd/MM/yyyy HH:mm"
              width="130"
            ></e-column>
            <e-column
              field="movementType"
              headerText="Tipo"
              textAlign="Center"
              width="80"
            ></e-column>
            <e-column
              field="documentNumber"
              headerText="Nº Movimiento"
              width="130"
            ></e-column>
            <e-column
              field="quantity"
              headerText="Cantidad"
              textAlign="Right"
              format="#,##0.000"
              width="100"
            ></e-column>
            <e-column
              field="uom"
              headerText="Unidad"
              width="80"
              textAlign="Center"
            ></e-column>
            <e-column
              field="weight"
              headerText="Peso"
              width="90"
              format="#,##0.000"
              textAlign="Right"
            ></e-column>
            <e-column
              field="totalCost"
              headerText="Costo Total"
              textAlign="Right"
              width="110"
              format="#,##0.00"
            ></e-column>
            <e-column
              field="origin"
              headerText="Origen"
              width="90"
            ></e-column>
            <e-column
              field="customerProviderName"
              headerText="Cliente / Proveedor"
              width="240"
            
            ></e-column>
            <e-column
              field="salesPersonName"
              headerText="Vendedor"
              width="160"
            ></e-column>
            <e-column
              field="warehouse"
              headerText="Almacén"
              width="160"
            ></e-column>
            <e-column field="warehouseId" [visible]="false"></e-column>
          </e-columns>

          <ng-template #editSettingsTemplate let-data>
            <div ngForm #movementForm="ngForm" class="movement-edit-dialog">
              <input
                type="hidden"
                name="movementId"
                [(ngModel)]="movementData.movementId"
              />
              <input
                type="hidden"
                name="merchandiseId"
                [(ngModel)]="movementData.merchandiseId"
              />
              <input
                type="hidden"
                name="organizationId"
                [(ngModel)]="movementData.organizationId"
              />
              <div class="dlg-row dlg-row-top">
                <label class="dlg-label">Mercancía</label>
                <ejs-textbox
                  [readonly]="true"
                  [multiline]="true"
                  cssClass="dlg-readonly-field"
                  [value]="merchandiseDisplayName"
                ></ejs-textbox>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Unidad</label>
                <ejs-dropdownlist
                  id="uom"
                  name="uom"
                  [(ngModel)]="movementData.uom"
                  [dataSource]="uomOptions"
                  [fields]="uomFields"
                  [allowFiltering]="true"
                  popupHeight="220px"
                  [required]="true"
                  (change)="onUomChange($event)"
                ></ejs-dropdownlist>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Fecha</label>
                <ejs-datetimepicker
                  id="movementDate"
                  name="movementDate"
                  [(ngModel)]="movementData.movementDate"
                  format="dd-MM-yyyy HH:mm"
                  [required]="true"
                ></ejs-datetimepicker>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Tipo movimiento</label>
                <ejs-dropdownlist
                  id="movementType"
                  name="movementType"
                  [(ngModel)]="movementData.movementType"
                  [dataSource]="(movementTypes$ | async) || []"
                  [fields]="movementTypeFields"
                  [allowFiltering]="true"
                  popupHeight="220px"
                  [required]="true"
                ></ejs-dropdownlist>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Origen</label>
                <ejs-dropdownlist
                  id="origin"
                  name="origin"
                  [(ngModel)]="movementData.origin"
                  [dataSource]="(origins$ | async) || []"
                  [fields]="originFields"
                  [allowFiltering]="true"
                  popupHeight="220px"
                  [required]="true"
                ></ejs-dropdownlist>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Nº Movimiento</label>
                <ejs-textbox
                  name="documentNumber"
                  [(ngModel)]="movementData.documentNumber"
                  [readonly]="true"
                  cssClass="dlg-readonly-field"
                ></ejs-textbox>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Nº Lote</label>
                <ejs-dropdownlist
                  id="lotNumber"
                  name="lotNumber"
                  [(ngModel)]="movementData.lotNumber"
                  [dataSource]="(lots$ | async) || []"
                  [fields]="lotFields"
                  [allowFiltering]="true"
                  [showClearButton]="true"
                  popupHeight="180px"
                ></ejs-dropdownlist>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Cantidad</label>
                <ejs-numerictextbox
                  id="quantity"
                  name="quantity"
                  [(ngModel)]="movementData.quantity"
                  format="n3"
                  [decimals]="3"
                  [validateDecimalOnType]="true"
                  [showSpinButton]="false"
                  [required]="true"
                  (change)="onQuantityOrCostChange()"
                ></ejs-numerictextbox>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Costo unitario</label>
                <ejs-numerictextbox
                  id="unitCost"
                  name="unitCost"
                  [(ngModel)]="movementData.unitCost"
                  format="n2"
                  [decimals]="2"
                  [validateDecimalOnType]="true"
                  [showSpinButton]="false"
                  (change)="onQuantityOrCostChange()"
                ></ejs-numerictextbox>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Almacén</label>
                <ejs-dropdownlist
                  id="warehouseId"
                  name="warehouseId"
                  [(ngModel)]="movementData.warehouseId"
                  [dataSource]="(warehouses$ | async) || []"
                  [fields]="warehouseFields"
                  [allowFiltering]="true"
                  popupHeight="220px"
                  [required]="true"
                ></ejs-dropdownlist>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Costo Total</label>
                <ejs-numerictextbox
                  name="totalCost"
                  [(ngModel)]="movementData.totalCost"
                  format="n2"
                  [decimals]="2"
                  [showSpinButton]="false"
                  [readonly]="true"
                  [enabled]="false"
                ></ejs-numerictextbox>
              </div>

              <div class="dlg-row">
                <label class="dlg-label">Peso total</label>
                <div class="dlg-weight">
                  <ejs-numerictextbox
                    name="weight"
                    [(ngModel)]="movementData.weight"
                    format="n3"
                    [decimals]="3"
                    [showSpinButton]="false"
                    [readonly]="true"
                    [enabled]="false"
                  ></ejs-numerictextbox>
                  <span class="dlg-weight-unit">Kgr.</span>
                </div>
              </div>

              <div class="dlg-row dlg-row-top">
                <label class="dlg-label">Comentario</label>
                <ejs-textbox
                  name="comment"
                  [(ngModel)]="movementData.comment"
                  [multiline]="true"
                ></ejs-textbox>
              </div>
            </div>
          </ng-template>
        </ejs-grid>
      </div>
    </div>
  </div>
</div>

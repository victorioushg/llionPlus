<div class="wrapper" [class.codes-only]="codesOnly">
  <div class="row" *ngIf="!codesOnly">
    <div class="col-md-12">
      <div id="merchandise-uom-grid">
        <ejs-grid
          #uomgrid
          [dataSource]="(uomData$ | async) || []"
          [toolbar]="uomToolbar"
          [editSettings]="uomEditSettings"
          [height]="uomGridHeight"
          [allowTextWrap]="true"
          [textWrapSettings]="{ wrapMode: 'Header' }"
        >
          <e-columns>
            <e-column
              field="uom"
              headerText="UV"
              [isPrimaryKey]="true"
            ></e-column>
            <e-column
              field="equivalence"
              headerText="Equivale"
              width="60"
              editType="numericedit"
              format="N3"
              textAlign="Right"
            ></e-column>
            <e-column field="uomEquivalent" headerText="UV Eq"></e-column>
            <e-column
              field="defaultUnit"
              headerText="Default"
              width="70"
              type="boolean"
              editType="booleanedit"
              [displayAsCheckBox]="true"
              textAlign="Center"
            ></e-column>
            <e-column
              field="divisible"
              headerText="Divide"
              type="boolean"
              editType="booleanedit"
              [displayAsCheckBox]="true"
              textAlign="Center"
            ></e-column>
            <e-column
              field="retail"
              headerText="Minor"
              type="boolean"
              editType="booleanedit"
              [displayAsCheckBox]="true"
              textAlign="Center"
            ></e-column>
            <e-column
              field="wholeSale"
              headerText="Mayor"
              type="boolean"
              editType="booleanedit"
              [displayAsCheckBox]="true"
              textAlign="Center"
            ></e-column>
            <e-column
              field="weight"
              headerText="Peso"
              editType="numericedit"
              format="N3"
              textAlign="Right"
            ></e-column>
            <e-column field="merchandiseId" [visible]="false"></e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
  </div>

  <div class="row codes-row">
    <div class="col-md-12">
      <div id="merchandise-codes-grid">
        <ejs-grid
          #codesgrid
          [dataSource]="(codesData$ | async) || []"
          [toolbar]="codesToolbar"
          [editSettings]="codesEditSettings"
          [height]="codesGridHeight"
          [allowTextWrap]="true"
          [textWrapSettings]="{ wrapMode: 'Header' }"
          (actionBegin)="codesActionBegin($event)"
        >
          <e-columns>
            <e-column
              field="code"
              headerText="Código"
              [isPrimaryKey]="true"
              width="28%"
            ></e-column>
            <e-column
              field="merchandiseCodeType"
              headerText="Tipo"
              width="32%"
              editType="dropdownedit"
              [edit]="codeTypeEditParams"
            ></e-column>
            <e-column
              field="description"
              headerText="Descripción"
              width="40%"
            ></e-column>
            <e-column field="merchandiseId" [visible]="false"></e-column>
            <e-column field="organizationId" [visible]="false"></e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
  </div>
</div>

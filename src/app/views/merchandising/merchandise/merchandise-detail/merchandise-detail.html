<div class="wrapper-detail" *ngIf="merchandise$ | async as mer">
  <form
    id="merchandise-detail-form"
    class="merchandise-detail-form"
    [formGroup]="merchandiseForm"
  >
    <div class="row">
      <div class="col-md-12">
        <ejs-textbox
          id="merchandise-txt"
          placeholder="nombre or descripción"
          floatLabelType="Always"
          formControlName="merchandiseName"
          [enabled]="enabled$ | async"
        ></ejs-textbox>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <ejs-dropdownlist
          id="merchandise-brands-ddl"
          formControlName="merchandiseBrands"
          #brands
          [dataSource]="merchandiseBrands$ | async"
          [fields]="brandfields"
          [enabled]="enabled$ | async"
          [allowFiltering]="true"
          floatLabelType="Always"
          placeholder="marca de mercancías"
        ></ejs-dropdownlist>
      </div>
      <div class="col-md-6">
        <ejs-dropdownlist
          id="merchandise-categories-ddl"
          formControlName="merchandiseCategories"
          #categories
          [dataSource]="merchandiseCategories$ | async"
          [fields]="categoryfields"
          [enabled]="enabled$ | async"
          [allowFiltering]="true"
          floatLabelType="Always"
          placeholder="Grupo de mercancías"
        ></ejs-dropdownlist>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <ejs-textbox
          id="merchandise-presentation-txt"
          placeholder="presentación"
          floatLabelType="Always"
          formControlName="merchandisePresentation"
          [enabled]="enabled$ | async"
        ></ejs-textbox>
      </div>
      <div class="col-md-6">
        <ejs-textbox
          id="merchandise-alterno-txt"
          placeholder="código alterno"
          floatLabelType="Always"
          formControlName="merchandiseAlternCode"
          [enabled]="enabled$ | async"
        ></ejs-textbox>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <ejs-dropdownlist
          id="merchandise-division-ddl"
          formControlName="merchandiseDivisions"
          #divisions
          [dataSource]="merchandiseDivisions$ | async"
          [fields]="divisionfields"
          [enabled]="enabled$ | async"
          [allowFiltering]="true"
          floatLabelType="Always"
          placeholder="Divisiones mercancías"
        ></ejs-dropdownlist>
      </div>
      <div class="col-md-6">
        <ejs-dropdownlist
          id="merchandise-type-ddl"
          formControlName="merchandiseTypes"
          #types
          [dataSource]="merchandiseTypes$ | async"
          [fields]="typefields"
          [enabled]="enabled$ | async"
          [allowFiltering]="true"
          floatLabelType="Always"
          placeholder="Tipos de mercancías"
        ></ejs-dropdownlist>
      </div>
    </div>
    <div class="row">
      <div class="col-md-3">
        <ejs-checkbox
          formControlName="merchandise-inactive"
          label="Activo"
        >
        </ejs-checkbox>
      </div>
      <div class="col-md-3">
        <ejs-checkbox
          formControlName="merchandise-regulated"
          label="Regulado"
        >
        </ejs-checkbox>
      </div>
      <div class="col-md-3">
        <ejs-checkbox
          formControlName="merchandise-returns"
          label="Acepta Retornos"
        >
        </ejs-checkbox>
      </div>
      <div class="col-md-3">
        <ejs-textbox
          id="merchandise-return-rate-txt"
          placeholder="Tasa de Retorno"
          floatLabelType="Always"
          formControlName="merchandiseReturnsRate"
          [enabled]="enabled$ | async"
        ></ejs-textbox>
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-md-6">
        <!-- <ejs-datepicker
          [value]="org.addedOn"
          format="dd/MM/yyyy"
          placeholder="Fecha Ingreso"
          floatLabelType="Always"
          formControlName="addedOn"
          [enabled]="enabled$ | async"
        >
        </ejs-datepicker> -->
      </div>
      <div class="col-md-6" style="margin-top: auto">
        <!-- <table style="width: 100%">
          <tr>
            <td style="width: 50%">Organización Activa</td>
            <td style="width: 50%">
              <ejs-switch
                formControlName="deactivated"
                [checked]="!org.deactivated"
                [disabled]="!(enabled$ | async)"
              >
              </ejs-switch> 
            </td>
          </tr>
        </table>-->
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-md-6"></div>
      <div class="col-md-6">
        <div id="form-buttons">
          <button
            ejs-button
            (click)="onCancelClick()"
            [disabled]="!(enabled$ | async)"
            style="float: right"
          >
            Cancelar
          </button>
          <button
            ejs-button
            (click)="onSaveClick()"
            cssClass="e-primary"
            [disabled]="!(enabled$ | async)"
            style="float: right"
          >
            Aceptar
          </button>
        </div>
      </div>
    </div>
  </form>
</div>

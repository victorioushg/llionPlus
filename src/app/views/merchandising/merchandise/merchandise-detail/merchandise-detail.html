<div class="wrapper-detail" *ngIf="merchandise$ | async as mer">
  <form
    id="merchandise-detail-form"
    class="merchandise-detail-form"
    [formGroup]="merchandiseForm"
  >
    <div class="row">
      <div class="col-md-12">
        <ejs-textbox
          id="merchandise-txt"
          placeholder="descripción"
          floatLabelType="Always"
          formControlName="name"
          [enabled]="enabled$ | async"
          [value]="mer.description"
        ></ejs-textbox>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <ejs-dropdownlist
          id="merchandise-type-ddl"
          formControlName="merchandiseType"
          #otypes
          [dataSource]="merchandiseBrands$ | async"
          [value]="mer.brandId"
          [fields]="brandfields"
          [enabled]="enabled$ | async"
          floatLabelType="Always"
          placeholder="marca de mercancías"
        ></ejs-dropdownlist>
      </div>
      <div class="col-md-6">
        <ejs-dropdownlist
          id="association-type-ddl"
          formControlName="associationType"
          #atypes
          [dataSource]="merchandiseCategories$ | async"
          [value]="mer.groupId"
          [fields]="categoryfields"
          [enabled]="enabled$ | async"
          floatLabelType="Always"
          placeholder="Grupo de mercancías" 
        ></ejs-dropdownlist> 
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <!-- <llion-grid-address></llion-grid-address>  -->
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <!-- <llion-grid-phone></llion-grid-phone>  -->
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <!-- <llion-grid-email></llion-grid-email>  -->
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-md-6">
        <!-- <ejs-datepicker
          [value]="org.addedOn"
          format="dd/MM/yyyy"
          placeholder="Fecha Ingreso"
          floatLabelType="Always"
          formControlName="addedOn"
          [enabled]="enabled$ | async"
        >
        </ejs-datepicker> -->
      </div>
      <div class="col-md-6" style="margin-top: auto">
        <!-- <table style="width: 100%">
          <tr>
            <td style="width: 50%">Organización Activa</td>
            <td style="width: 50%">
              <ejs-switch
                formControlName="deactivated"
                [checked]="!org.deactivated"
                [disabled]="!(enabled$ | async)"
              >
              </ejs-switch> 
            </td>
          </tr>
        </table>-->
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-md-6"></div>
      <div class="col-md-6">
        <div id="form-buttons" >
          <button 
            ejs-button
            (click)="onCancelClick()"
            [disabled]="!(enabled$ | async)"
            style="float: right"
          >
            Cancelar
          </button>
          <button 
            ejs-button
            (click)="onSaveClick()"
            cssClass="e-primary"
            [disabled]="!(enabled$ | async)"
            style="float: right"
          >
            Aceptar
          </button>
        </div>
      </div>
    </div>
  </form>
</div>

<div id="container" class="container">
  <div class="row">
    <div class="col-lg-5">
      <div id="provider-document-grid">
        <ejs-grid
          #grid
          [dataSource]="(documents$ | async) || []"
          [allowFiltering]="false"
          [allowSorting]="false"
          [toolbar]="toolbar"
          [height]="screenHeight"
          [searchSettings]="searchSettings"
          [allowTextWrap]="false"
          clipMode="EllipsisWithTooltip"
          (actionBegin)="actionBegin($event)"
          (toolbarClick)="onToolbarClick($event)"
          (rowSelected)="onRowSelected($event)"
          (rowDeselected)="onRowDeselected($event)"
          (recordDoubleClick)="onRecordDoubleClick($event)"
          (commandClick)="commandClick($event)"
        >
          <e-columns>
            <e-column width="50" [commands]="commands" clipMode="Clip"></e-column>
            <e-column
              field="documentNumber"
              [headerText]="config.listNumberHeader"
              width="110"
              clipMode="EllipsisWithTooltip"
            ></e-column>
            <e-column
              field="providerName"
              headerText="Proveedor"
              width="200"
              clipMode="EllipsisWithTooltip"
            ></e-column>
            <e-column
              field="issueDate"
              headerText="Emisión"
              type="date"
              format="dd/MM/yyyy"
              width="110"
            ></e-column>
            <e-column
              field="documentId"
              [isPrimaryKey]="true"
              [visible]="false"
            ></e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
    <div class="col-lg-7 purchase-order-detail-col" [style.height.px]="panelHeight">
      <llion-provider-document-detail></llion-provider-document-detail>
    </div>
  </div>
</div>

<div id="container" class="container">
  <div class="row">
    <div class="col-lg-4">
      <div id="customer-grid" [class.wrapper]="disabledGrid$ | async">
        <ejs-grid
          #grid
          [dataSource]="customers$ | async"
          [allowFiltering]="enabled$ | async"
          [cssClass]="(disabledGrid$ | async) ? 'disablegrid' : ''"
          [toolbar]="toolbar"
          [height]="screenHeight"
          [searchSettings]="searchSettings"
          (actionBegin)="actionBegin($event)"
          (toolbarClick)="onToolbarClick($event)"
          (rowSelected)="onRowSelected($event)"
          (rowDeselected)="onRowDeselected($event)"
          (recordDoubleClick)="onRecordDoubleClick($event)"
          (commandClick)="commandClick($event)"
        >
          <e-columns>
            <e-column width="50" [commands]="commands"></e-column>
            <e-column
              field="description"
              headerText="cliente"
              width="230"
            ></e-column>
            <e-column
              field="alternCode"
              headerText="código"
              width="100"
            ></e-column>
            <e-column
              field="customerId"
              [isPrimaryKey]="true"
              [visible]="false"
            ></e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
    <div class="col-lg-8">
      <ejs-tab id="tabs" #tabs loadOn="Init">
        <e-tabitems>
          <e-tabitem [header]="headerText[0]">
            <ng-template #content>
              <div class="row">
                <div class="col-lg-12">
                  <llion-customer-detail></llion-customer-detail>
                </div>
              </div>
            </ng-template>
          </e-tabitem>
          <e-tabitem [header]="headerText[1]">
            <ng-template #content>
              <llion-customer-movements></llion-customer-movements>
            </ng-template>
          </e-tabitem>
        </e-tabitems>
      </ejs-tab>
    </div>
  </div>
</div>

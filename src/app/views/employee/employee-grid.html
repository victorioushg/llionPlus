<div id="container" class="container">
  <div class="row">
    <div class="col-lg-4">
      <div id="employee-grid" [class.wrapper]="disabledGrid$ | async">
        <ejs-grid
          #grid
          [dataSource]="employees$ | async"
          [allowFiltering]="enabled$ | async"
          [cssClass]="(disabledGrid$ | async) ? 'disablegrid' : ''"
          [toolbar]="toolbar"
          [height]="screenHeight"
          [searchSettings]="searchSettings"
          (actionBegin)="actionBegin($event)"
          (toolbarClick)="onToolbarClick($event)"
          (rowSelected)="onRowSelected($event)"
          (rowDeselected)="onRowDeselected($event)"
          (recordDoubleClick)="onRecordDoubleClick($event)"
          (commandClick)="commandClick($event)"
        >
          <e-columns>
            <e-column width="50" [commands]="commands"></e-column>
            <e-column
              field="lastName"
              headerText="apellidos"
              width="140"
            ></e-column>
            <e-column
              field="firstName"
              headerText="nombres"
              width="140"
            ></e-column>
            <e-column
              field="alternCode"
              headerText="código"
              width="90"
            ></e-column>
            <e-column
              field="employeeId"
              [isPrimaryKey]="true"
              [visible]="false"
            ></e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
    <div class="col-lg-8">
      <ejs-tab id="tabs" #tabs>
        <e-tabitems>
          <e-tabitem [header]="headerText[0]">
            <div class="row">
              <div class="col-lg-12">
                <ng-template #content>
                  <llion-employee-detail></llion-employee-detail>
                </ng-template>
              </div>
            </div>
          </e-tabitem>
        </e-tabitems>
      </ejs-tab>
    </div>
  </div>
</div>

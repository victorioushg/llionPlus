<div id="container" class="container">
  <div class="row">
    <div class="col-lg-4">
      <div id="accounts-grid" [class.wrapper]="disabledGrid$ | async">
        <ejs-grid
          #grid
          [dataSource]="accounts$ | async"
          [allowFiltering]="enabled$ | async"
          [cssClass]="(disabledGrid$ | async) ? 'disablegrid' : ''"
          [toolbar]="toolbar"
          [height]="screenHeight"
          [searchSettings]="searchSettings"
          (actionBegin)="actionBegin($event)"
          (toolbarClick)="onToolbarClick($event)"
          (rowSelected)="onRowSelected($event)"
          (rowDeselected)="onRowDeselected($event)"
          (recordDoubleClick)="onRecordDoubleClick($event)"
          (commandClick)="commandClick($event)"
        >
          <e-columns>
            <e-column width="50" [commands]="commands"></e-column>
            <e-column field="code" headerText="código" width="90"></e-column>
            <e-column field="name" headerText="nombre" width="180"></e-column>
            <e-column
              field="accountType"
              headerText="tipo"
              width="120"
            ></e-column>
            <e-column
              field="accountId"
              [isPrimaryKey]="true"
              [visible]="false"
            ></e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
    <div class="col-lg-8">
      <ejs-tab id="tabs" #tabs loadOn="Init">
        <e-tabitems>
          <e-tabitem [header]="headerText[0]">
            <ng-template #content>
              <div class="row">
                <div class="col-lg-12">
                  <llion-account-detail></llion-account-detail>
                </div>
              </div>
            </ng-template>
          </e-tabitem>
          <e-tabitem [header]="headerText[1]">
            <ng-template #content>
              <llion-account-movements></llion-account-movements>
            </ng-template>
          </e-tabitem>
          <e-tabitem [header]="headerText[2]">
            <ng-template #content>
              <llion-account-monthly-balances></llion-account-monthly-balances>
            </ng-template>
          </e-tabitem>
        </e-tabitems>
      </ejs-tab>
    </div>
  </div>
</div>
